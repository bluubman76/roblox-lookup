<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roblox Profile Lookup</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a22;
    --border: #2a2f3a;
    --text: #e7e9ee;
    --muted: #9099ab;
    --accent: #00a2ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    padding: 40px 20px;
    padding-top: calc(40px + env(safe-area-inset-top, 0px));
    min-height: 100vh;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; font-size: 0.92rem; }
  form { display: flex; gap: 8px; margin: 24px 0; }
  input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 1rem;
  }
  input:focus { outline: 2px solid var(--accent); }
  button {
    padding: 12px 18px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #05131f;
    font-weight: 600;
    cursor: pointer;
    font-size: 1rem;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-top: 8px;
  }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.95rem; }
  .row:last-child { border-bottom: none; }
  .row span:first-child { color: var(--muted); }
  .games { margin-top: 14px; }
  .game { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
  .game:last-child { border-bottom: none; }
  .status { color: var(--muted); font-size: 0.9rem; min-height: 1.2em; margin-top: 8px; }
  .error { color: #ff6b6b; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Roblox Profile Lookup</h1>
  <p class="sub">Look up public profile info Roblox already shows — join date, description, favorite games.</p>

  <form id="lookupForm">
    <input id="usernameInput" type="text" placeholder="Roblox username" autocomplete="off" required>
    <button type="submit" id="searchBtn">Search</button>
  </form>

  <div class="status" id="status"></div>
  <div id="result"></div>
</div>

<script>
const form = document.getElementById('lookupForm');
const input = document.getElementById('usernameInput');
const status = document.getElementById('status');
const result = document.getElementById('result');
const btn = document.getElementById('searchBtn');

// Roblox's API doesn't allow direct browser requests (CORS), so requests
// are routed through a public read-only CORS proxy.
const PROXY = 'https://corsproxy.io/?url=';

async function fetchJSON(url, options) {
  const res = await fetch(PROXY + encodeURIComponent(url), options);
  if (!res.ok) throw new Error('Request failed: ' + res.status);
  return res.json();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = input.value.trim();
  if (!username) return;

  result.innerHTML = '';
  status.textContent = 'Looking up ' + username + '...';
  status.classList.remove('error');
  btn.disabled = true;

  try {
    // Step 1: username -> userId
    const idData = await fetchJSON('https://users.roblox.com/v1/usernames/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usernames: [username], excludeBannedUsers: false })
    });

    if (!idData.data || idData.data.length === 0) {
      status.textContent = 'No user found with that username.';
      status.classList.add('error');
      btn.disabled = false;
      return;
    }

    const userId = idData.data[0].id;

    // Step 2: user details
    const details = await fetchJSON('https://users.roblox.com/v1/users/' + userId);

    // Step 3: favorite games (may be empty/private)
    let favorites = [];
    try {
      const favData = await fetchJSON('https://games.roblox.com/v2/users/' + userId + '/favorite/games?limit=10&sortOrder=Asc');
      favorites = favData.data || [];
    } catch (err) {
      favorites = [];
    }

    const joined = new Date(details.created).toLocaleDateString(undefined, {
      year: 'numeric', month: 'long', day: 'numeric'
    });

    let html = '<div class="card">';
    html += row('Username', escapeHtml(details.name));
    html += row('Display name', escapeHtml(details.displayName));
    html += row('User ID', details.id);
    html += row('Joined', joined);
    html += row('Description', details.description ? escapeHtml(details.description) : '(none set)');
    html += '</div>';

    html += '<div class="card games">';
    html += '<div style="color:var(--muted); font-size:0.85rem; margin-bottom:8px;">Favorite games</div>';
    if (favorites.length === 0) {
      html += '<div class="game">None public, private, or none set.</div>';
    } else {
      favorites.forEach(g => {
        html += '<div class="game">' + escapeHtml(g.name) + '</div>';
      });
    }
    html += '</div>';

    html += '<p style="margin-top:14px;"><a href="https://www.roblox.com/users/' + userId + '/profile" target="_blank" rel="noopener">View full profile on Roblox →</a></p>';

    result.innerHTML = html;
    status.textContent = '';
  } catch (err) {
    status.textContent = 'Something went wrong: ' + err.message + '. The proxy service may be temporarily unavailable — try again shortly.';
    status.classList.add('error');
  } finally {
    btn.disabled = false;
  }
});

function row(label, value) {
  return '<div class="row"><span>' + label + '</span><span>' + value + '</span></div>';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
